---
spec:
  inputs:
    packages:
      type: 'string'
      default: '.'
    targets:
      type: 'string'
      default: 'linux:amd64'
    upload:
      type: 'boolean'
      default: false
    upload_url:
      type: 'string'
      default: 'https://files.heap.re/upload'
    upload_ca:
      type: 'string'
      default: '/etc/ssl/certs/ISRG_Root_X1.pem'

---
image: debian:13

workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /(skip-ci|skip-gitlab)/i'
      when: never
    - when: always

variables:
  GIT_DEPTH: 0
  LC_ALL: 'C'
  TZ: 'UTC'

build:
  stage: build
  script: |
    set -euo pipefail

    echo "=> Install packages"
    apt-get update
    apt-get -y dist-upgrade
    apt-get -y install ca-certificates curl git golang openssl

    echo "=> Verify repository"
    echo "$ALLOWED_SIGNERS" >"${HOME}/.signers"
    git -c gpg.ssh.allowedSignersFile="${HOME}/.signers" verify-commit HEAD
    git checkout -B "$CI_COMMIT_REF_NAME"
    git -c gpg.ssh.allowedSignersFile="${HOME}/.signers" verify-commit HEAD

    echo "=> Retrieve dependencies"
    go mod tidy
    go mod verify
    git diff go.mod go.sum
    sha256sum --strict --check go.pin

    echo "=> Configure go"
    go env -w GOPROXY="off" CGO_ENABLED="0"

    echo "=> Regular build"
    go generate ./...
    go build -o "build/" -mod=readonly -trimpath -tags netgo,osusergo $[[ inputs.packages ]]

    echo "=> Release build"
    GOFER_RELEASE=true go generate ./...

    for target in $[[ inputs.targets ]]; do
      export GOOS="${target%%:*}"
      export GOARCH="${target#*:}"
      go build -o "build/release/${GOOS}-${GOARCH}/" \
        -mod=readonly -trimpath -tags netgo,osusergo -buildmode=pie \
        -ldflags="-s -w -buildid=" $[[ inputs.packages ]]
    done

    echo "=> Checksum"
    find build ! -type d -exec sha256sum --tag '{}' \; | sort
    find build ! -type d -exec openssl blake2s256 '{}' \; | sort

    if [ "$[[ inputs.upload ]]" = "true" ]; then
      echo "=> Upload"

      project="$(basename "$(pwd)")"
      pkgs="$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)"
      cd build/release

      for pkg in ${pkgs[@]}; do
        name="$(basename "$pkg")"

        for path in */"${name}"*; do
          platform="$(dirname "$path")"
          filename="$(basename "$path")"
          url="$[[ inputs.upload_url ]]/${project}/${filename}-${platform}-${CI_COMMIT_SHORT_SHA}"
          echo "=> Uploading $path to $url"

          curl \
            -X PUT \
            --fail \
            --proto =https \
            --tlsv1.3 \
            --capath /enoent \
            --cacert "$[[ inputs.upload_ca ]]" \
            --user "$UPLOAD_KEY" \
            --upload-file "$path" \
            "$url"
        done
      done
    fi
